name: Build GoW Collection 32-bit

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Build Native Libraries (32-bit)
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-android-pfs.sh
          ./scripts/build-android-runtime.sh
          ./scripts/build-android-vkshim.sh

      - name: Copy .so to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp -f build/lib/*.so android/app/src/main/jniLibs/armeabi-v7a/ || true

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gow-32bit-debug
          path: android/app/build/outputs/apk/debug/*.apk
          
